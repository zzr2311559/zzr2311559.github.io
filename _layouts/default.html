<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      svg: {
        fontCache: "global"
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-brand-group">
      <a class="site-brand" href="{{ '/' | relative_url }}">
        <img class="site-avatar" src="{{ '/assets/images/avatar.png' | relative_url }}" width="34" height="34" alt="zzr2311559 的头像">
        <span class="site-title">zzr2311559</span>
      </a>
      <button class="theme-toggle" type="button" aria-label="切换到夜间模式" aria-pressed="false">
        <span class="theme-icon moon" aria-hidden="true"></span>
        <span class="theme-icon sun" aria-hidden="true"></span>
      </button>
    </div>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/posts/' | relative_url }}">文章</a>
      <a href="{{ '/topics/' | relative_url }}">主题</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>

  {{ content }}

  <footer class="site-footer">
    <p>© 2026 zzr2311559. Built with GitHub Pages.</p>
  </footer>
  <script src="{{ '/theme-toggle.js' | relative_url }}"></script>
</body>
</html>
