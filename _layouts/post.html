---
layout: default
---

<main class="article-page">
  <article class="article">
    <a class="text-link" href="{{ '/posts/' | relative_url }}">返回文章列表</a>
    <p class="post-meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.topic %} / {{ page.topic }}{% endif %}
      {% if page.tags %}
        /
        {% for tag in page.tags %}
          #{{ tag }}{% unless forloop.last %} {% endunless %}
        {% endfor %}
      {% endif %}
    </p>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </article>
</main>
